openapi: 3.1.0
info:
  title: Title
  description: Title
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'

paths:
  /api/documents:
    post:
      operationId: "uploadDocument"
      tags:
        - "Document"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: "Document accepted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatusResponse"
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

components:
  schemas:
    DocumentStatusResponse:
      type: object
      description: "Document info processing status response"
      properties:
        id:
          type: string
          format: uuid
          description: "Unique document info identifier (e.g. 660e8400-e29b-41d4-a716-446655440001)"
        documentStatus:
          $ref: 'common-components.yaml#/components/schemas/DocumentStatus'
          description: "Current document info processing status (e.g. QUEUED, PROCESSING, COMPLETED, FAILED)"
        fileName:
          type: string
          description: "Original name of the uploaded file (e.g. lecture-notes.pdf)"
        createdAt:
          type: string
          format: date-time
          description: "Document info creation timestamp (e.g. 2024-01-15T10:05:00Z)"
        updatedAt:
          type: string
          format: date-time
          description: "Last document info status update timestamp (e.g. 2024-01-15T14:30:00Z)"
