spring:
  application:
    name: edu-material-actualizer
  config:
    import:
      - 'file:.env[.properties]'
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-5-mini
    mcp:
      client:
        streamable-http:
          connections:
            wigolo:
              url: http://localhost:3333
              endpoint: /mcp
        request-timeout: 120s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  http:
    clients:
      connect-timeout: 30s
      read-timeout: 120s

app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-names:
      - temporal
      - results
    files:
      scheduler:
        exriration:
          cron: "0 0 10 * * *"
      cleanup: 7d
  system-one:
    laya:
      base-url: "http://${LAYA_HOST:localhost}:${LAYA_PORT:9100}"
      model: laya_multilingual
    ollama:
      base-url: "http://localhost:11434"
      model: tev_1_0_8b
    jev:
      model: jev_latest
      api-key: ${JEV_API_KEY}
    response:
      threshold: 0.7
    type: laya
  document:
    parser:
      aggregated-text:
        characters-per-paragraph: 500

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
