services:
  redis:
    image: redis:7.2-alpine
    container_name: ema-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ema-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  laya:
    build: ./docker/laya
    container_name: ema-systemone-laya
    ports:
      - "9100:8000"
    environment:
      - LAYA_DEVICE=cuda
      - LAYA_PRELOAD=1
      - LAYA_BIND_ADDRESS=0.0.0.0
      - LAYA_MODELS=multilingual
    volumes:
      - laya_model_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  wigolo:
    image: ghcr.io/knockoutez/wigolo:latest
    container_name: ema-wigolo
    ports:
      - "3333:3333"
    volumes:
      - wigolo_data:/data
    environment:
      - WIGOLO_SERVE_ALLOW_UNAUTHENTICATED=1
    command: serve --host 0.0.0.0

volumes:
  redis_data:
  minio_data:
  laya_model_cache:
  wigolo_data:
