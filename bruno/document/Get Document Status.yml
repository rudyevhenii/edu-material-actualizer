info:
  name: Get Document Status
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/api/documents/:documentId/status"
  params:
    - name: documentId
      value: "{{DOCUMENT_ID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
