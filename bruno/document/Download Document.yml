info:
  name: Download Document
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE_URL}}/api/documents/:documentId/download"
  params:
    - name: documentId
      value: "{{DOCUMENT_ID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
