info:
  name: Get All Documents Info By Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/documents/:status"
  params:
    - name: status
      value: COMPLETED
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
